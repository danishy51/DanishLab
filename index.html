<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Danishy51 | Welcome</title>
    <!-- Font Awesome Icons Link -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }
        .container {
            background-color: #161b22;
            padding: 35px 25px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            border: 1px solid #30363d;
            max-width: 450px;
            width: 85%;
            margin: 20px auto;
        }
        h1 {
            color: #58a6ff;
            margin-bottom: 10px;
            font-size: 2.2rem;
        }
        p {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #8b949e;
            margin-bottom: 20px;
        }
        .social-links {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 25px;
        }
        .social-btn {
            display: flex;
            align-items: center;
            padding: 12px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.05rem;
            transition: transform 0.2s, filter 0.2s;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .social-btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }
        .social-btn i {
            font-size: 1.4rem;
            margin-right: 15px;
            width: 25px;
            text-align: center;
        }
        .social-text {
            display: flex;
            flex-direction: column;
            text-align: left;
        }
        .social-title {
            font-size: 0.85rem;
            opacity: 0.8;
            font-weight: normal;
        }
        .social-username {
            font-size: 1.05rem;
        }
        /* Social Colors */
        .facebook { background-color: #1877f2; color: white; }
        .youtube { background-color: #ff0000; color: white; }
        .whatsapp { background-color: #25d366; color: white; }
        .linktree { background-color: #39e09b; color: #1d212a; }
    </style>
</head>

        <!-- Aap ke Social Accounts -->

            <a href="https://facebook.com\danishy51" target="_blank" class="social-btn facebook">
                <i class="fab fa-facebook-f"></i>
                <div class="social-text">
                    <span class="social-title">Facebook</span>
                    <span class="social-username">@danishy51</span>
                </div>
            </a>

            <!-- YouTube -->
            <a href="https://youtube.com/danishy51" target="_blank" class="social-btn youtube">
                <i class="fab fa-youtube"></i>
                <div class="social-text">
                    <span class="social-title">YouTube</span>
                    <span class="social-username">@danishy51</span>
                </div>
            </a>

            <!-- WhatsApp -->
            <a href="https://wa.me" target="_blank" class="social-btn whatsapp">
                <i class="fab fa-whatsapp"></i>
                <div class="social-text">
                    <span class="social-title">WhatsApp</span>
                    <span class="social-username">+923067488053</span>
                </div>
            </a>

            <!-- Linktree -->
            <a href="https://linktr.ee/danishy51" target="_blank" class="social-btn linktree">

                <div class="social-text">
                    <span class="social-title">Linktree</span>
                    <span class="social-username">linktr.ee/danishy51</span>
                </div>

        </div>
    </div>

</body>
